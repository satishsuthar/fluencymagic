<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Free Fluency Test | Fluency Magic</title>
  <meta name="description" content="Discover your English speaking fluency level, biggest speaking block, and recommended 7-day practice direction.">
  <style>
    :root {
      --ink: #101318;
      --muted: #667085;
      --line: #e5e7eb;
      --paper: #fffefa;
      --soft: #f4f8f6;
      --green: #149f5b;
      --green-dark: #0c6d3e;
      --yellow: #f7b801;
      --blue: #4387ee;
      --shadow: 0 24px 80px rgba(16, 19, 24, .1);
      --radius: 8px;
      --max: 980px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 80% 8%, rgba(247, 184, 1, .2), transparent 28%),
        radial-gradient(circle at 8% 70%, rgba(67, 135, 238, .13), transparent 30%),
        linear-gradient(180deg, #fffefa, #f6fbf8);
      font-family: "Segoe UI Variable", "Aptos", Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.55;
      min-height: 100vh;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -24% auto auto -12%;
      z-index: -1;
      width: 42vw;
      min-width: 280px;
      aspect-ratio: 1;
      border-radius: 48%;
      background: radial-gradient(circle, rgba(20, 159, 91, .14), transparent 68%);
      animation: floatGlow 12s ease-in-out infinite alternate;
    }

    body::after {
      content: "";
      position: fixed;
      right: -16%;
      bottom: -26%;
      z-index: -1;
      width: 48vw;
      min-width: 320px;
      aspect-ratio: 1;
      border-radius: 45%;
      background: radial-gradient(circle, rgba(67, 135, 238, .13), transparent 68%);
      animation: floatGlow 14s ease-in-out infinite alternate-reverse;
    }

    @keyframes floatGlow {
      from { transform: translate3d(0, 0, 0) scale(1); }
      to { transform: translate3d(5%, 4%, 0) scale(1.08); }
    }

    a { color: inherit; text-decoration: none; }
    button, input, select { font: inherit; }

    .shell {
      width: min(var(--max), calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 54px;
    }

    .topbar {
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-weight: 950;
      font-size: 20px;
    }

    .brand img { width: 42px; height: 42px; object-fit: contain; }
    .back { color: var(--muted); font-size: 14px; font-weight: 800; }

    .progress-wrap {
      margin: 22px 0 28px;
      display: grid;
      gap: 10px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 850;
    }

    .progress-track {
      height: 10px;
      border-radius: 999px;
      background: rgba(16, 19, 24, .08);
      overflow: hidden;
    }

    .progress-fill {
      display: block;
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--green), var(--yellow), var(--blue));
      transition: width .35s ease;
    }

    .card {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(16, 19, 24, .1);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, .92);
      box-shadow: var(--shadow);
      padding: clamp(24px, 5vw, 52px);
      min-height: 620px;
      display: grid;
      align-content: center;
      animation: cardIn .45s ease both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: none; }
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 10px;
      background: linear-gradient(90deg, var(--green), var(--yellow), var(--blue));
    }

    .kicker {
      display: inline-flex;
      width: max-content;
      max-width: 100%;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      padding: 9px 12px;
      border-radius: 999px;
      border: 1px solid rgba(20, 159, 91, .18);
      color: var(--green-dark);
      background: #fff;
      font-size: 13px;
      font-weight: 900;
    }

    .kicker::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--yellow);
      box-shadow: 0 0 0 6px rgba(247, 184, 1, .18);
    }

    h1, h2, h3, p { margin-top: 0; }
    h1, h2, h3 { line-height: 1.04; letter-spacing: 0; }
    h1 { max-width: 780px; margin-bottom: 20px; font-size: clamp(42px, 7vw, 76px); font-weight: 950; }
    h2 { max-width: 760px; margin-bottom: 18px; font-size: clamp(30px, 5vw, 54px); font-weight: 950; }
    h3 { margin-bottom: 10px; font-size: 22px; font-weight: 930; }
    .lead { max-width: 760px; margin-bottom: 0; color: var(--muted); font-size: 19px; }

    .bullets {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin: 28px 0 0;
      padding: 0;
      list-style: none;
    }

    .bullets li, .option, .field {
      border: 1px solid rgba(16, 19, 24, .1);
      border-radius: var(--radius);
      background: #fff;
    }

    .bullets li {
      padding: 16px;
      font-weight: 780;
    }

    .bullets li::before {
      content: "";
      display: block;
      width: 34px;
      height: 7px;
      margin-bottom: 14px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--green), var(--yellow), var(--blue));
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 34px;
    }

    .button {
      min-height: 52px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 22px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      font-weight: 930;
      cursor: pointer;
      transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
    }

    .button:hover { transform: translateY(-2px); }
    .button-primary { color: #fff; background: var(--green); box-shadow: 0 18px 38px rgba(20, 159, 91, .24); }
    .button-primary:hover { background: var(--green-dark); }
    .button-secondary { color: var(--ink); background: #fff; border-color: rgba(16, 19, 24, .14); }
    .button:disabled { cursor: not-allowed; opacity: .5; transform: none; }

    .microcopy { margin-top: 18px; color: var(--muted); font-size: 14px; font-weight: 760; }
    .options { display: grid; gap: 12px; margin-top: 28px; }
    .option {
      width: 100%;
      min-height: 58px;
      padding: 16px 18px;
      text-align: left;
      color: var(--ink);
      cursor: pointer;
      font-weight: 830;
      transition: border .2s ease, box-shadow .2s ease, transform .2s ease, background .2s ease;
    }

    .option:hover, .option.selected {
      border-color: rgba(20, 159, 91, .45);
      background: #f7fcf9;
      box-shadow: 0 12px 32px rgba(20, 159, 91, .08);
      transform: translateY(-1px);
    }

    .scale {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-top: 28px;
    }

    .scale .option {
      min-height: 96px;
      display: grid;
      place-items: center;
      text-align: center;
    }

    .recorder {
      margin-top: 28px;
      display: grid;
      gap: 18px;
    }

    .timer {
      width: 156px;
      height: 156px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background:
        radial-gradient(circle at center, #fff 0 58%, transparent 59%),
        conic-gradient(var(--green) var(--timer-progress, 0deg), rgba(16, 19, 24, .08) 0deg);
      color: var(--ink);
      font-size: 40px;
      font-weight: 950;
    }

    .prompt-card {
      display: grid;
      gap: 10px;
      margin-top: 20px;
      padding: 20px;
      border-radius: var(--radius);
      background: var(--soft);
      border: 1px solid rgba(16, 19, 24, .08);
    }

    .prompt-card ul {
      margin: 0;
      padding-left: 20px;
      color: var(--muted);
    }

    .transcript-card {
      display: grid;
      gap: 10px;
      margin-top: 18px;
      padding: 18px;
      border: 1px solid rgba(67, 135, 238, .18);
      border-radius: var(--radius);
      background: linear-gradient(135deg, rgba(67, 135, 238, .08), rgba(20, 159, 91, .06)), #fff;
    }

    .transcript-card strong {
      color: var(--ink);
    }

    .transcript-card p {
      margin: 0;
      color: var(--muted);
    }

    .transcript-text {
      min-height: 74px;
      padding: 14px;
      border-radius: var(--radius);
      background: rgba(255, 255, 255, .8);
      color: var(--ink);
      font-weight: 720;
    }

    .analysis-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .analysis-pills span {
      padding: 7px 10px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid rgba(16, 19, 24, .08);
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-top: 28px;
    }

    label { display: grid; gap: 8px; color: var(--muted); font-size: 13px; font-weight: 850; }
    input, select {
      min-height: 52px;
      width: 100%;
      padding: 0 14px;
      border: 1px solid rgba(16, 19, 24, .14);
      border-radius: var(--radius);
      background: #fff;
      color: var(--ink);
    }

    .hidden { display: none !important; }

    @media (max-width: 720px) {
      .shell { width: min(100% - 24px, var(--max)); padding-top: 14px; }
      .brand { font-size: 17px; }
      .brand img { width: 36px; height: 36px; }
      .back { display: none; }
      .card { min-height: calc(100vh - 150px); }
      .bullets, .form-grid, .scale { grid-template-columns: 1fr; }
      .button { width: 100%; }
      .actions { align-items: stretch; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/">
        <img src="../logo_1.png" alt="" aria-hidden="true">
        <span>Fluency Magic</span>
      </a>
      <a class="back" href="/">Back to landing page</a>
    </header>

    <div class="progress-wrap" aria-label="Test progress">
      <div class="progress-meta">
        <span id="stepLabel">Free Fluency Test</span>
        <span id="stepCount">Intro</span>
      </div>
      <div class="progress-track"><span class="progress-fill" id="progressFill"></span></div>
    </div>

    <main class="card" id="app" tabindex="-1"></main>
  </div>

  <script type="module">
    try {
      const { pipeline, env } = await import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1");
      env.allowLocalModels = false;
      env.useBrowserCache = true;

      let transcriberPromise;

      window.FluencyTranscriber = {
        async transcribe(blob, onStatus = () => {}) {
          onStatus("Loading private browser transcription model...");
          if (!transcriberPromise) {
            transcriberPromise = pipeline("automatic-speech-recognition", "onnx-community/whisper-tiny.en", {
              progress_callback: (progress) => {
                if (progress.status === "progress" && progress.progress) {
                  onStatus(`Loading speech model ${Math.round(progress.progress)}%...`);
                } else if (progress.status) {
                  onStatus("Preparing speech model...");
                }
              }
            });
          }

          const transcriber = await transcriberPromise;
          onStatus("Preparing your recording locally...");
          const audio = await decodeAudioTo16k(blob);
          onStatus("Transcribing your recording locally...");
          const output = await transcriber(audio, {
            chunk_length_s: 30,
            stride_length_s: 5,
            language: "english",
            task: "transcribe"
          });
          return Array.isArray(output) ? output.map((item) => item.text || "").join(" ") : (output.text || "");
        }
      };

      async function decodeAudioTo16k(blob) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) {
          throw new Error("Audio decoding is not supported in this browser.");
        }

        const arrayBuffer = await blob.arrayBuffer();
        const audioContext = new AudioContextClass();
        try {
          const decoded = await audioContext.decodeAudioData(arrayBuffer.slice(0));
          const source = decoded.getChannelData(0);
          const targetRate = 16000;

          if (decoded.sampleRate === targetRate) {
            return source;
          }

          const ratio = decoded.sampleRate / targetRate;
          const length = Math.max(1, Math.round(source.length / ratio));
          const resampled = new Float32Array(length);

          for (let i = 0; i < length; i += 1) {
            const position = i * ratio;
            const before = Math.floor(position);
            const after = Math.min(before + 1, source.length - 1);
            const weight = position - before;
            resampled[i] = source[before] * (1 - weight) + source[after] * weight;
          }

          return resampled;
        } finally {
          audioContext.close?.();
        }
      }
    } catch (error) {
      window.FluencyTranscriber = null;
      console.warn("Browser-local transcription is unavailable.", error);
    }
  </script>

  <script>
    const questions = [
      {
        id: "category",
        title: "What best describes you?",
        options: ["Student", "Job seeker", "Working professional", "Business owner", "Homemaker", "Migrant / living abroad", "Other"]
      },
      {
        id: "problem",
        title: "What is your biggest English speaking problem?",
        options: ["I understand English but cannot speak fluently", "I translate in my mind before speaking", "I cannot find the right words quickly", "I worry about grammar while speaking", "My pronunciation or voice feels unclear", "I feel nervous or embarrassed", "I can speak, but I do not sound natural"]
      },
      {
        id: "need",
        title: "Where do you need English the most?",
        options: ["Job interviews", "Workplace meetings", "Client calls", "Study / college", "Social conversations", "Travel / daily life", "Presentations", "General confidence"]
      },
      {
        id: "confidence",
        title: "How confident do you feel while speaking English?",
        scale: true,
        options: ["1 = Very nervous", "2 = Hesitant", "3 = Sometimes okay", "4 = Mostly confident", "5 = Very confident"]
      },
      {
        id: "whenSpeaking",
        title: "What usually happens when you try to speak English?",
        options: ["I stop after a few words", "I speak slowly with many pauses", "I use very simple sentences", "I make grammar mistakes and lose confidence", "I forget words", "I avoid speaking", "I can speak but I do not sound polished"]
      },
      {
        id: "practice",
        title: "How often do you practise speaking English aloud?",
        options: ["Almost never", "Once or twice a week", "A few minutes daily", "Regularly", "I speak often but still want to improve"]
      },
      {
        id: "goal",
        title: "What is your main goal?",
        options: ["Speak without hesitation", "Improve interview confidence", "Speak better at work", "Sound more natural", "Improve pronunciation and clarity", "Build daily speaking habit", "Express thoughts clearly"]
      }
    ];

    const tasks = [
      {
        id: "main60",
        title: "60-Second Speaking Task",
        headline: "Now speak for 60 seconds.",
        seconds: 60,
        prompt: "Tell us about yourself, where you use English, and what problem you face when you try to speak.",
        bullets: ["Who are you?", "Where do you need English?", "What happens when you try to speak?", "What do you want to improve?", "How would your life change if you spoke English confidently?"],
        microcopy: "Speak naturally. This is not an exam. We are checking your speaking flow, word availability, sentence formation, and confidence."
      },
      {
        id: "wordFlow",
        title: "Word Flow Check",
        headline: "Use the word confidence in three spoken sentences.",
        seconds: 45,
        prompt: "Record 3 sentences using the word confidence.",
        bullets: ["Try to make each sentence meaningful.", "Use the word naturally.", "You can use confidence, confident, or confidently."],
        microcopy: "This checks whether useful words are ready in natural combinations, not just stored as isolated vocabulary."
      },
      {
        id: "patterns",
        title: "Sentence Pattern Check",
        headline: "Complete and speak these sentence starters naturally.",
        seconds: 60,
        prompt: "Speak all four sentence starters in one recording.",
        bullets: ["I want to improve...", "I have been trying to...", "One challenge I face is...", "I feel more confident when..."],
        microcopy: "This checks sentence completion, grammar pattern comfort, natural flow, and your ability to extend ideas."
      },
      {
        id: "realLife",
        title: "Real-Life Speaking Check",
        headline: "Imagine you are in a job interview or professional introduction.",
        seconds: 45,
        prompt: "Answer this: Tell me about yourself.",
        bullets: ["Speak for 30-45 seconds.", "Keep it clear and natural.", "Focus on your ideas, not perfect grammar."],
        microcopy: "This checks clarity, organisation, confidence, sentence flow, and natural expression."
      }
    ];

    const app = document.getElementById("app");
    const progressFill = document.getElementById("progressFill");
    const stepLabel = document.getElementById("stepLabel");
    const stepCount = document.getElementById("stepCount");
    const state = {
      index: -1,
      answers: {},
      recordings: {},
      lead: {}
    };

    let mediaRecorder = null;
    let chunks = [];
    let timerId = null;
    let remaining = 0;
    let activeTask = null;
    let speechRecognition = null;
    let liveTranscript = "";

    function totalSteps() {
      return 1 + questions.length + tasks.length + 1;
    }

    function setProgress(label, current) {
      const total = totalSteps();
      const safeCurrent = Math.max(1, Math.min(current, total));
      progressFill.style.width = `${Math.round((safeCurrent / total) * 100)}%`;
      stepLabel.textContent = label;
      stepCount.textContent = `Step ${safeCurrent} of ${total}`;
    }

    function renderIntro() {
      setProgress("Test intro", 1);
      app.innerHTML = `
        <section>
          <div class="kicker">Free Fluency Test</div>
          <h1>Find Out Why You Get Stuck While Speaking English</h1>
          <p class="lead">You may understand English. You may know the words. But if your voice freezes when it is time to speak, your fluency system needs training. This free test will show where you are getting stuck and what to practise next.</p>
          <ul class="bullets">
            <li>Discover your current fluency level</li>
            <li>Identify your biggest speaking block</li>
            <li>Understand whether your issue is word flow, sentence formation, grammar patterns, confidence, or expression</li>
            <li>See your browser-generated transcript and personalised 7-day practice direction</li>
          </ul>
          <div class="actions">
            <button class="button button-primary" type="button" id="start">Start My Free Test</button>
          </div>
          <p class="microcopy">Takes around 3-5 minutes. No grammar exam. No judgement. Audio transcription runs in your browser when supported.</p>
        </section>
      `;
      document.getElementById("start").addEventListener("click", () => {
        state.index = 0;
        renderQuestion();
      });
    }

    function renderQuestion() {
      const q = questions[state.index];
      setProgress("Basic profile", 2 + state.index);
      const optionsClass = q.scale ? "scale" : "options";
      app.innerHTML = `
        <section>
          <div class="kicker">Quick self-check</div>
          <h2>${q.title}</h2>
          <p class="lead">Choose the answer that feels closest. There are no wrong answers here.</p>
          <div class="${optionsClass}">
            ${q.options.map((option) => `<button class="option" type="button" data-value="${escapeHtml(option)}">${option}</button>`).join("")}
          </div>
          <div class="actions">
            <button class="button button-secondary" type="button" id="back">Back</button>
            <button class="button button-primary" type="button" id="next" disabled>Continue</button>
          </div>
        </section>
      `;
      let selected = state.answers[q.id] || "";
      document.querySelectorAll(".option").forEach((button) => {
        if (button.dataset.value === selected) button.classList.add("selected");
        button.addEventListener("click", () => {
          selected = button.dataset.value;
          state.answers[q.id] = selected;
          document.querySelectorAll(".option").forEach((item) => item.classList.remove("selected"));
          button.classList.add("selected");
          document.getElementById("next").disabled = false;
        });
      });
      document.getElementById("next").disabled = !selected;
      document.getElementById("back").addEventListener("click", () => {
        if (state.index === 0) renderIntro();
        else {
          state.index -= 1;
          renderQuestion();
        }
      });
      document.getElementById("next").addEventListener("click", () => {
        if (state.index < questions.length - 1) {
          state.index += 1;
          renderQuestion();
        } else {
          state.index = 0;
          renderTask();
        }
      });
    }

    function renderTask() {
      activeTask = tasks[state.index];
      setProgress(activeTask.title, 2 + questions.length + state.index);
      const existing = state.recordings[activeTask.id];
      app.innerHTML = `
        <section>
          <div class="kicker">${activeTask.title}</div>
          <h2>${activeTask.headline}</h2>
          <p class="lead">${activeTask.prompt}</p>
          <div class="prompt-card">
            <strong>You can include:</strong>
            <ul>${activeTask.bullets.map((item) => `<li>${item}</li>`).join("")}</ul>
          </div>
          <div class="recorder">
            <div class="timer" id="timer">${activeTask.seconds}</div>
            <div class="actions">
              <button class="button button-primary" type="button" id="record">${existing ? "Re-record Once" : "Start Recording"}</button>
              <button class="button button-secondary" type="button" id="complete">${existing ? "Continue" : "Use Practice Mode"}</button>
            </div>
            <p class="microcopy" id="recordStatus">${existing ? "Recording saved for this task. You can continue or re-record once." : activeTask.microcopy}</p>
            <div class="transcript-card ${existing?.transcript ? "" : "hidden"}" id="transcriptCard">
              <strong>Your transcript</strong>
              <div class="transcript-text" id="transcriptText">${existing?.transcript || ""}</div>
              <div class="analysis-pills" id="analysisPills">${existing?.analysis ? renderAnalysisPills(existing.analysis) : ""}</div>
              <p id="transcriptNote">${existing?.transcript ? "This transcript was created in your browser and is used only to generate your fluency snapshot." : ""}</p>
            </div>
          </div>
        </section>
      `;
      remaining = activeTask.seconds;
      updateTimer();
      document.getElementById("record").addEventListener("click", toggleRecording);
      document.getElementById("complete").addEventListener("click", completeTask);
    }

    async function toggleRecording() {
      if (mediaRecorder && mediaRecorder.state === "recording") {
        stopRecording();
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        chunks = [];
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = (event) => chunks.push(event.data);
        mediaRecorder.onstop = () => {
          stream.getTracks().forEach((track) => track.stop());
          stopLiveRecognition();
          const blob = new Blob(chunks, { type: "audio/webm" });
          state.recordings[activeTask.id] = {
            recorded: true,
            duration: activeTask.seconds - remaining,
            size: blob.size,
            transcript: "",
            analysis: null,
            note: "Audio captured and transcribed in browser when supported."
          };
          const browserTranscript = liveTranscript.trim();
          if (browserTranscript) {
            const analysis = analyzeTranscript(browserTranscript, activeTask.id, state.recordings[activeTask.id].duration);
            state.recordings[activeTask.id].transcript = browserTranscript;
            state.recordings[activeTask.id].analysis = analysis;
            state.recordings[activeTask.id].transcriptionStatus = "browser-speech-complete";
            showTranscript(browserTranscript, analysis, "Transcript captured by your browser during recording.");
            document.getElementById("recordStatus").textContent = "Recording saved. Your transcript is ready.";
          } else {
            document.getElementById("recordStatus").textContent = "Recording saved. Creating your transcript in this browser...";
            transcribeRecording(blob, activeTask.id);
          }
          document.getElementById("complete").textContent = "Continue";
        };
        mediaRecorder.start();
        startLiveRecognition();
        document.getElementById("record").textContent = "Stop Recording";
        document.getElementById("recordStatus").textContent = "Recording... speak naturally. This is not an exam.";
        timerId = window.setInterval(() => {
          remaining -= 1;
          updateTimer();
          if (remaining <= 0) stopRecording();
        }, 1000);
      } catch (error) {
        state.recordings[activeTask.id] = {
          recorded: false,
          duration: 0,
          fallback: true,
          note: "Microphone permission was unavailable. User continued in practice mode."
        };
        document.getElementById("recordStatus").textContent = "Microphone access is blocked. You can still continue and receive a self-assessment based report.";
        document.getElementById("complete").textContent = "Continue";
      }
    }

    function stopRecording() {
      window.clearInterval(timerId);
      if (mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop();
      document.getElementById("record").textContent = "Re-record Once";
    }

    function updateTimer() {
      const timer = document.getElementById("timer");
      if (!timer || !activeTask) return;
      timer.textContent = remaining;
      const progress = ((activeTask.seconds - remaining) / activeTask.seconds) * 360;
      timer.style.setProperty("--timer-progress", `${progress}deg`);
    }

    function completeTask() {
      if (!state.recordings[activeTask.id]) {
        state.recordings[activeTask.id] = { recorded: false, duration: 0, fallback: true, note: "Skipped recording; practice-mode completion." };
      }
      if (state.index < tasks.length - 1) {
        state.index += 1;
        renderTask();
      } else {
        renderLead();
      }
    }

    function startLiveRecognition() {
      liveTranscript = "";
      const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Recognition) return;

      try {
        speechRecognition = new Recognition();
        speechRecognition.lang = "en-US";
        speechRecognition.continuous = true;
        speechRecognition.interimResults = true;
        speechRecognition.onresult = (event) => {
          let transcript = "";
          for (let i = 0; i < event.results.length; i += 1) {
            transcript += event.results[i][0].transcript + " ";
          }
          liveTranscript = transcript;
          const card = document.getElementById("transcriptCard");
          const text = document.getElementById("transcriptText");
          const note = document.getElementById("transcriptNote");
          if (card && text && transcript.trim()) {
            card.classList.remove("hidden");
            text.textContent = transcript.trim();
            note.textContent = "Live browser transcript is being captured while you speak.";
          }
        };
        speechRecognition.onerror = () => {
          speechRecognition = null;
        };
        speechRecognition.start();
      } catch (error) {
        speechRecognition = null;
      }
    }

    function stopLiveRecognition() {
      if (!speechRecognition) return;
      try {
        speechRecognition.stop();
      } catch (error) {
        // The browser may already have stopped recognition.
      }
      speechRecognition = null;
    }

    async function transcribeRecording(blob, taskId) {
      const card = document.getElementById("transcriptCard");
      const text = document.getElementById("transcriptText");
      const note = document.getElementById("transcriptNote");
      const pills = document.getElementById("analysisPills");
      card.classList.remove("hidden");
      text.textContent = "Loading private browser transcription...";
      note.textContent = "The first transcription can take a little longer while the model loads.";

      if (!window.FluencyTranscriber) {
        text.textContent = "Transcription is still loading. You can continue, and your score will use your answers for now.";
        note.textContent = "No audio is uploaded to a Fluency Magic server in this prototype.";
        state.recordings[taskId].transcriptionStatus = "transcriber-loading";
        return;
      }

      try {
        const transcript = await window.FluencyTranscriber.transcribe(blob, (status) => {
          note.textContent = status;
        });
        const cleanTranscript = transcript.trim();
        const analysis = analyzeTranscript(cleanTranscript, taskId, state.recordings[taskId].duration);
        state.recordings[taskId].transcript = cleanTranscript;
        state.recordings[taskId].analysis = analysis;
        state.recordings[taskId].transcriptionStatus = "complete";
        showTranscript(
          cleanTranscript || "We could not detect enough speech. Try again in a quiet place and speak naturally.",
          analysis,
          "Transcript generated locally in this browser. Use re-record if it does not reflect what you said."
        );
      } catch (error) {
        console.warn("Browser transcription failed", error);
        state.recordings[taskId].transcriptionStatus = "failed";
        state.recordings[taskId].transcriptionError = error.message;
        text.textContent = "This is a preliminary fluency snapshot based on your answers. Your detailed voice-based transcript could not be generated right now.";
        note.textContent = "You can continue. Your audio has not been uploaded to a Fluency Magic server.";
      }
    }

    function showTranscript(transcript, analysis, message) {
      const card = document.getElementById("transcriptCard");
      const text = document.getElementById("transcriptText");
      const note = document.getElementById("transcriptNote");
      const pills = document.getElementById("analysisPills");
      if (!card || !text || !note || !pills) return;
      card.classList.remove("hidden");
      text.textContent = transcript;
      pills.innerHTML = analysis ? renderAnalysisPills(analysis) : "";
      note.textContent = message;
    }

    function analyzeTranscript(transcript, taskId, duration) {
      const words = transcript.toLowerCase().match(/[a-z']+/g) || [];
      const fillerWords = ["um", "umm", "uh", "actually", "like", "you", "know"];
      const fillerCount = words.filter((word, index) => {
        if (word === "you" && words[index + 1] === "know") return true;
        return fillerWords.includes(word);
      }).length;
      const uniqueWords = new Set(words).size;
      const sentenceCount = Math.max(0, (transcript.match(/[.!?]/g) || []).length);
      const wordCombos = ["build confidence", "express an idea", "handle pressure", "make progress", "share an update", "speak naturally", "find words", "improve speaking"];
      const comboCount = wordCombos.filter((combo) => transcript.toLowerCase().includes(combo)).length;
      const confidenceForms = ["confidence", "confident", "confidently"].filter((form) => transcript.toLowerCase().includes(form)).length;
      const patternHits = ["i want to", "i have been trying to", "one challenge i face is", "i feel more confident when"].filter((pattern) => transcript.toLowerCase().includes(pattern)).length;
      return {
        wordCount: words.length,
        uniqueWords,
        fillerCount,
        sentenceCount,
        wordsPerMinute: duration ? Math.round((words.length / Math.max(duration, 1)) * 60) : 0,
        comboCount,
        confidenceForms,
        patternHits,
        taskId
      };
    }

    function renderAnalysisPills(analysis) {
      return `
        <span>${analysis.wordCount} words</span>
        <span>${analysis.wordsPerMinute} wpm</span>
        <span>${analysis.fillerCount} fillers</span>
        <span>${analysis.sentenceCount} sentence markers</span>
      `;
    }

    function renderLead() {
      setProgress("Lead capture", totalSteps());
      app.innerHTML = `
        <section>
          <div class="kicker">Your Fluency Report Is Ready</div>
          <h2>Your Fluency Report Is Ready</h2>
          <p class="lead">Enter your details to receive your fluency level, speaking block diagnosis, and personalised 7-day practice direction.</p>
          <form class="form-grid" id="leadForm">
            <label>First name<input required name="firstName" autocomplete="given-name"></label>
            <label>Email<input required type="email" name="email" autocomplete="email"></label>
            <label>WhatsApp number<input required name="phone" autocomplete="tel"></label>
            <label>Country<input required name="country" autocomplete="country-name"></label>
            <label>Main goal<select required name="mainGoal">
              <option value="">Choose one</option>
              <option>Speak without hesitation</option>
              <option>Improve interview confidence</option>
              <option>Speak better at work</option>
              <option>Sound more natural</option>
              <option>Improve pronunciation and clarity</option>
              <option>Build daily speaking habit</option>
              <option>Express thoughts clearly</option>
            </select></label>
          </form>
          <div class="actions">
            <button class="button button-primary" type="submit" form="leadForm">Show My Fluency Report</button>
          </div>
          <p class="microcopy">We'll send your practice plan and reminders. No spam.</p>
        </section>
      `;
      document.getElementById("leadForm").addEventListener("submit", (event) => {
        event.preventDefault();
        state.lead = Object.fromEntries(new FormData(event.currentTarget).entries());
        const result = buildResult();
        localStorage.setItem("fluencyMagicTest", JSON.stringify({
          ...state,
          result,
          createdAt: new Date().toISOString()
        }));
        window.location.href = "/fluency-test/result";
      });
    }

    function buildResult() {
      const a = state.answers;
      const confidence = Number((a.confidence || "3").charAt(0)) || 3;
      const practiceMap = {
        "Almost never": -12,
        "Once or twice a week": -6,
        "A few minutes daily": 3,
        "Regularly": 10,
        "I speak often but still want to improve": 14
      };
      const problem = a.problem || "";
      const event = a.whenSpeaking || "";
      const practiceBonus = practiceMap[a.practice] || 0;
      const recordingBonus = Object.values(state.recordings).filter((item) => item.recorded).length * 3;
      const transcriptScore = getTranscriptScore();
      const base = 24 + confidence * 8 + practiceBonus + recordingBonus;
      const scores = {
        speechFlow: clamp(base + transcriptScore.speechFlow + (event.includes("pauses") ? -12 : 0) + (event.includes("stop") ? -14 : 0)),
        wordAvailability: clamp(base + transcriptScore.wordAvailability + (problem.includes("right words") || event.includes("forget") ? -16 : 0)),
        sentencePatternComfort: clamp(base + transcriptScore.sentencePatternComfort + (problem.includes("grammar") || event.includes("simple") ? -12 : 0)),
        expressionClarity: clamp(base + transcriptScore.expressionClarity + (a.goal === "Express thoughts clearly" ? -8 : 2)),
        naturalness: clamp(base + transcriptScore.naturalness + (problem.includes("natural") ? -14 : 0)),
        speakingConfidence: clamp(base + transcriptScore.speakingConfidence + (problem.includes("nervous") || event.includes("avoid") ? -18 : 0) + confidence * 2)
      };
      const overall = Math.round(
        scores.speechFlow * .2 +
        scores.wordAvailability * .2 +
        scores.sentencePatternComfort * .2 +
        scores.expressionClarity * .15 +
        scores.naturalness * .15 +
        scores.speakingConfidence * .1
      );
      const level = getLevel(overall);
      const block = getBlock(problem, event, scores);
      const recommendedPlan = getRecommendedPlan(block);
      return {
        scores,
        subScores: scores,
        overall,
        overallScore: overall,
        level,
        fluencyLevel: level,
        block,
        mainSpeakingBlock: block,
        recommendedPlan: block.planKey,
        plan: recommendedPlan
      };
    }

    function getTranscriptScore() {
      const analyses = Object.values(state.recordings).map((item) => item.analysis).filter(Boolean);
      if (!analyses.length) {
        return { speechFlow: 0, wordAvailability: 0, sentencePatternComfort: 0, expressionClarity: 0, naturalness: 0, speakingConfidence: 0 };
      }
      const totalWords = analyses.reduce((sum, item) => sum + item.wordCount, 0);
      const totalFillers = analyses.reduce((sum, item) => sum + item.fillerCount, 0);
      const totalSentences = analyses.reduce((sum, item) => sum + item.sentenceCount, 0);
      const totalCombos = analyses.reduce((sum, item) => sum + item.comboCount + item.confidenceForms, 0);
      const patternHits = analyses.reduce((sum, item) => sum + item.patternHits, 0);
      const avgWpm = Math.round(analyses.reduce((sum, item) => sum + item.wordsPerMinute, 0) / analyses.length);
      const fillerPenalty = Math.min(14, totalFillers * 2);
      const shortPenalty = totalWords < 55 ? -12 : totalWords < 90 ? -5 : 4;
      return {
        speechFlow: clampDelta((avgWpm >= 70 && avgWpm <= 150 ? 8 : -4) + shortPenalty - fillerPenalty),
        wordAvailability: clampDelta(totalCombos * 5 + (totalWords > 90 ? 5 : -5)),
        sentencePatternComfort: clampDelta(totalSentences * 2 + patternHits * 6 + (totalWords > 80 ? 3 : -6)),
        expressionClarity: clampDelta(totalWords > 100 ? 9 : totalWords > 65 ? 3 : -8),
        naturalness: clampDelta(totalCombos * 3 + patternHits * 3 - Math.min(10, totalFillers)),
        speakingConfidence: clampDelta(totalWords > 80 ? 6 : -6)
      };
    }

    function clampDelta(value) {
      return Math.max(-18, Math.min(18, Math.round(value)));
    }

    function clamp(value) {
      return Math.max(8, Math.min(96, Math.round(value)));
    }

    function getLevel(score) {
      if (score <= 25) return { levelNumber: 1, name: "Silent Understander", levelName: "Silent Understander", range: "0-25", scoreRange: "0-25", headline: "Your voice is ready to start moving.", description: "You may understand some English, but speaking feels uncomfortable or difficult. You may avoid speaking, stop after a few words, or feel unsure about how to begin.", nextFocus: ["Short speaking drills", "Mouth flow practice", "Simple sentence patterns", "Daily 30-second speaking habit"], encouragingLine: "You do not need to speak perfectly. You need to start training your voice step by step." };
      if (score <= 45) return { levelNumber: 2, name: "Hesitant Speaker", levelName: "Hesitant Speaker", range: "26-45", scoreRange: "26-45", headline: "You have English inside you. Now it needs to flow.", description: "You can speak some English, but you may pause often, translate in your mind, search for words, or worry about grammar while speaking.", nextFocus: ["Speech Flow", "Word Combinations", "Sentence Patterns", "Daily speaking missions"], encouragingLine: "You are not starting from zero. You already have English inside you. Now we need to make it flow." };
      if (score <= 65) return { levelNumber: 3, name: "Functional Speaker", levelName: "Functional Speaker", range: "46-65", scoreRange: "46-65", headline: "Your foundation is there. Now your expression needs more range.", description: "You can communicate basic ideas in English, but your speech may feel slow, simple, repetitive, or not fully natural.", nextFocus: ["Natural word groups", "Sentence expansion", "Expression upgrade drills", "Real-life conversation practice"], encouragingLine: "Your foundation is already there. Now Fluency Magic will help you sound more natural, clear, and confident." };
      if (score <= 82) return { levelNumber: 4, name: "Natural Speaker", levelName: "Natural Speaker", range: "66-82", scoreRange: "66-82", headline: "You are close to strong fluency.", description: "You can speak clearly in many situations, but you may still need more polish, smoother expression, professional fluency, and stronger confidence in important moments.", nextFocus: ["Advanced expression", "Professional speaking practice", "Storytelling", "Interview and meeting fluency"], encouragingLine: "Now the focus is polish, presence, and powerful expression." };
      return { levelNumber: 5, name: "Confident Communicator", levelName: "Confident Communicator", range: "83-100", scoreRange: "83-100", headline: "Your voice is already strong.", description: "You speak with clarity, flow, and confidence. You can express your ideas naturally and handle many real-life English situations well.", nextFocus: ["Leadership communication", "Advanced storytelling", "Persuasive speaking", "Presentation fluency"], encouragingLine: "Now we help you make your voice more powerful, precise, and memorable." };
    }
    function getBlock(problem, event, scores) {
      const blocks = {
        mouth: { name: "Mouth Flow Block", blockName: "Mouth Flow Block", planKey: "mouthFlow", meaning: "You may know what you want to say, but your mouth, tongue, breath, and voice are not yet comfortable producing English smoothly.", whyItHappens: "English has not been practised enough as a physical speaking skill.", practice: "Short phrase repetition, mouth movement drills, slow-clear-fast speaking practice, sentence expansion, and daily voice practice.", recommendedPractice: ["Short phrase repetition", "Mouth movement drills", "Slow-clear-fast speaking practice"] },
        word: { name: "Word Availability Block", blockName: "Word Availability Block", planKey: "wordAvailability", meaning: "You may know many words, but useful words and word groups do not come quickly while speaking.", whyItHappens: "Most learners memorise isolated words, but fluent speakers use natural word combinations.", practice: "Word combination drills, core word mastery, phrase group practice, verb-noun combinations, and common expressions.", recommendedPractice: ["Word combination drills", "Core word mastery", "Phrase group practice"] },
        sentence: { name: "Sentence Formation Block", blockName: "Sentence Formation Block", planKey: "sentenceFormation", meaning: "You may know words, but full sentences do not form naturally and quickly.", whyItHappens: "Your mind may be collecting words one by one instead of using ready sentence patterns.", practice: "Sentence pattern drills, sentence expansion practice, common speaking structures, and repeated pattern-based practice.", recommendedPractice: ["Sentence pattern drills", "Sentence expansion practice", "Common speaking structures"] },
        grammar: { name: "Grammar Pattern Block", blockName: "Grammar Pattern Block", planKey: "grammarPattern", meaning: "You may think too much about grammar while speaking, and that breaks your flow.", whyItHappens: "Grammar has been learned as rules, not as natural speaking patterns.", practice: "Pattern-based grammar practice, natural sentence repetition, common tense structures through speaking, and grammar without rule memorisation.", recommendedPractice: ["Pattern-based grammar practice", "Natural sentence repetition", "Common tense structures"] },
        expression: { name: "Expression Block", blockName: "Expression Block", planKey: "expression", meaning: "You can say basic things, but your real thoughts, feelings, and personality do not fully come out in English.", whyItHappens: "You may be using very simple sentences or direct translations.", practice: "Say It Better drills, opinion speaking, storytelling practice, emotion expression, and real-life speaking missions.", recommendedPractice: ["Say It Better drills", "Opinion speaking", "Storytelling practice"] },
        confidence: { name: "Confidence Block", blockName: "Confidence Block", planKey: "confidence", meaning: "Your English may be better than you think, but nervousness, fear, or self-doubt blocks your speaking.", whyItHappens: "Negative experiences, fear of mistakes, or lack of safe speaking practice can make your mind go blank.", practice: "Safe daily recording practice, low-pressure speaking tasks, repetition, confidence-building feedback, and gradual real-life speaking challenges.", recommendedPractice: ["Safe daily recording practice", "Low-pressure speaking tasks", "Confidence-building repetition"] }
      };
      if (problem.includes("right words") || event.includes("forget")) return blocks.word;
      if (problem.includes("grammar") || event.includes("grammar")) return blocks.grammar;
      if (problem.includes("nervous") || event.includes("avoid")) return blocks.confidence;
      if (problem.includes("natural") || event.includes("polished")) return blocks.expression;
      if (event.includes("simple sentences")) return blocks.sentence;
      if (scores.naturalness <= 45 && scores.sentencePatternComfort <= 50) return blocks.grammar;
      const priority = [
        ["speechFlow", blocks.mouth],
        ["wordAvailability", blocks.word],
        ["sentencePatternComfort", blocks.sentence],
        ["speakingConfidence", blocks.confidence],
        ["expressionClarity", blocks.expression],
        ["naturalness", blocks.expression]
      ];
      const lowest = Math.min(...Object.values(scores));
      const match = priority.find(([key]) => scores[key] === lowest);
      if (match) return match[1];
      return blocks.mouth;
    }

    function getRecommendedPlan(block) {
      const plans = {
        mouthFlow: { planName: "7-Day Voice Flow Activation", focus: "Train your mouth, breath, rhythm, and speaking flow.", cta: "Start My Free 7-Day Plan" },
        wordAvailability: { planName: "7-Day Word Combination Activation", focus: "Make useful words and natural word groups ready for speaking.", cta: "Start My Free 7-Day Plan" },
        sentenceFormation: { planName: "7-Day Sentence Pattern Activation", focus: "Make common sentence structures automatic.", cta: "Start My Free 7-Day Plan" },
        grammarPattern: { planName: "7-Day Natural Grammar Pattern Activation", focus: "Practise grammar as speaking patterns, not rules.", cta: "Start My Free 7-Day Plan" },
        expression: { planName: "7-Day Expression Upgrade Activation", focus: "Say basic ideas in clearer, more natural, and more confident ways.", cta: "Start My Free 7-Day Plan" },
        confidence: { planName: "7-Day Speaking Confidence Activation", focus: "Build comfort through safe, simple, daily speaking practice.", cta: "Start My Free 7-Day Plan" }
      };
      return plans[block.planKey] || plans.wordAvailability;
    }

    function escapeHtml(value) {
      return value.replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[char]));
    }

    renderIntro();
  </script>

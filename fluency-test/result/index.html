<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Fluency Result | Fluency Magic</title>
  <style>
    :root {
      --ink: #101318;
      --muted: #667085;
      --line: #e5e7eb;
      --paper: #fffefa;
      --soft: #f4f8f6;
      --green: #149f5b;
      --green-dark: #0c6d3e;
      --yellow: #f7b801;
      --blue: #4387ee;
      --shadow: 0 24px 80px rgba(16, 19, 24, .1);
      --radius: 8px;
      --max: 1120px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 82% 14%, rgba(247, 184, 1, .2), transparent 28%),
        linear-gradient(180deg, #fffefa, #f6fbf8);
      font-family: "Segoe UI Variable", "Aptos", Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.55;
    }

    body::before {
      content: "";
      position: fixed;
      left: -14%;
      top: 12%;
      z-index: -1;
      width: 42vw;
      min-width: 280px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(20, 159, 91, .12), transparent 68%);
      animation: floatGlow 14s ease-in-out infinite alternate;
    }

    @keyframes floatGlow {
      from { transform: translate3d(0, 0, 0) scale(1); }
      to { transform: translate3d(5%, 3%, 0) scale(1.08); }
    }

    a { color: inherit; text-decoration: none; }
    .shell { width: min(var(--max), calc(100% - 32px)); margin: 0 auto; padding: 24px 0 64px; }
    .topbar { min-height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand { display: inline-flex; align-items: center; gap: 12px; font-weight: 950; font-size: 20px; }
    .brand img { width: 42px; height: 42px; object-fit: contain; }
    .link { color: var(--muted); font-size: 14px; font-weight: 850; }
    h1, h2, h3, p { margin-top: 0; }
    h1, h2, h3 { line-height: 1.04; letter-spacing: 0; }
    h1 { margin-bottom: 18px; font-size: clamp(42px, 7vw, 76px); font-weight: 950; }
    h2 { margin-bottom: 16px; font-size: clamp(30px, 4.5vw, 52px); font-weight: 950; }
    h3 { margin-bottom: 10px; font-size: 22px; font-weight: 930; }
    .lead { color: var(--muted); font-size: 19px; }
    .hero, .panel, .score-card, .conversion {
      border: 1px solid rgba(16, 19, 24, .1);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, .92);
      box-shadow: var(--shadow);
    }
    .hero { position: relative; overflow: hidden; padding: clamp(28px, 5vw, 54px); margin-top: 22px; }
    .hero, .panel, .conversion { animation: riseIn .45s ease both; }
    @keyframes riseIn {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: none; }
    }
    .hero::before, .conversion::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 10px;
      background: linear-gradient(90deg, var(--green), var(--yellow), var(--blue));
    }
    .hero-grid { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 34px; align-items: center; }
    .score-ring {
      width: 220px;
      height: 220px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background:
        radial-gradient(circle at center, #fff 0 57%, transparent 58%),
        conic-gradient(var(--green) var(--score-deg), rgba(16, 19, 24, .08) 0deg);
      margin-left: auto;
      text-align: center;
    }
    .score-ring strong { display: block; font-size: 54px; line-height: 1; }
    .score-ring span { color: var(--muted); font-weight: 850; }
    .badge {
      display: inline-flex;
      width: max-content;
      max-width: 100%;
      margin-bottom: 18px;
      padding: 9px 12px;
      border-radius: 999px;
      color: var(--green-dark);
      background: #fff;
      border: 1px solid rgba(20, 159, 91, .18);
      font-size: 13px;
      font-weight: 930;
    }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 22px; }
    .panel, .score-card, .conversion { padding: 24px; }
    .scores { display: grid; gap: 12px; }
    .score-row { display: grid; grid-template-columns: 1fr 74px; gap: 12px; align-items: center; }
    .score-row p { margin: 4px 0 8px; color: var(--muted); font-size: 13px; }
    .track { height: 10px; border-radius: 999px; background: rgba(16, 19, 24, .08); overflow: hidden; }
    .fill { display: block; height: 100%; width: var(--w); border-radius: inherit; background: linear-gradient(90deg, var(--green), var(--yellow), var(--blue)); }
    .block-card {
      border-left: 7px solid var(--yellow);
      background: #fff8d7;
    }
    .button {
      min-height: 52px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 22px;
      border-radius: var(--radius);
      border: 1px solid transparent;
      color: #fff;
      background: var(--green);
      font-weight: 930;
      box-shadow: 0 18px 38px rgba(20, 159, 91, .24);
    }
    .actions { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 28px; }
    .conversion { position: relative; overflow: hidden; margin-top: 22px; }
    .empty { text-align: center; padding: 80px 24px; }

    @media (max-width: 820px) {
      .hero-grid, .grid { grid-template-columns: 1fr; }
      .score-ring { margin: 0; }
      .link { display: none; }
      .button { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/">
        <img src="../../logo_1.png" alt="" aria-hidden="true">
        <span>Fluency Magic</span>
      </a>
      <a class="link" href="/fluency-test">Retake test</a>
    </header>

    <main id="result"></main>
  </div>

  <script>
    const levelTemplates = {
      "Silent Understander": {
        headline: "Your voice is ready to start moving.",
        what: "Your English may be sitting in your mind, but it is not yet ready on your tongue.",
        focus: "Short speaking drills, mouth flow practice, simple sentence patterns, and a daily 30-second speaking habit.",
        encourage: "This is a starting point, not a limitation. Your first goal is simple speaking comfort, not perfection.",
        cta: "Start your free 7-day plan and begin training your voice step by step."
      },
      "Hesitant Speaker": {
        headline: "You have English inside you. Now it needs to flow.",
        what: "You are not starting from zero. You already understand English. But your speaking system needs daily practice so words come faster and sentences form more naturally.",
        focus: "Speech flow, word combinations, sentence patterns, and reducing the translation habit.",
        encourage: "With the right daily practice, you can start feeling the difference quickly.",
        cta: "Start your free 7-day plan and begin training your speaking flow today."
      },
      "Functional Speaker": {
        headline: "Your foundation is there. Now your expression needs more range.",
        what: "You can speak, but you may not express your complete personality, ideas, confidence, or intelligence in English yet.",
        focus: "Natural word groups, sentence expansion, expression upgrade drills, real-life conversation practice, and storytelling.",
        encourage: "Your foundation is already there. Now Fluency Magic will help you sound more natural, clear, and confident.",
        cta: "Start your free 7-day plan and strengthen your natural expression."
      },
      "Natural Speaker": {
        headline: "You are close to strong fluency.",
        what: "You are already communicating well, but you can become sharper, more expressive, and more powerful in important conversations.",
        focus: "Advanced expression, professional speaking practice, storytelling, interview and meeting fluency, and confident presence.",
        encourage: "Now the focus is polish, presence, and powerful expression.",
        cta: "Start your free 7-day plan and polish your speaking presence."
      },
      "Confident Communicator": {
        headline: "Your voice is already strong.",
        what: "Your next level is not basic fluency. Your next level is influence, storytelling, professional presence, emotional expression, and powerful communication.",
        focus: "Leadership communication, advanced storytelling, persuasive speaking, presentation fluency, and high-level professional expression.",
        encourage: "You already have a strong foundation. Your next level is making your voice more powerful, precise, and memorable.",
        cta: "Start your free 7-day plan and sharpen your advanced expression."
      }
    };

    const blockTemplates = {
      "Mouth Flow Block": {
        explanation: "Your main block is Mouth Flow. This means English may be present in your mind, but it does not come out smoothly when you speak.",
        why: "This often happens when English has been learned silently through reading, listening, or thinking, but not spoken enough aloud.",
        practice: "Speech organ drills, rhythm practice, repeated phrase speaking, and slow-clear-fast practice help your mouth become comfortable with English.",
        plan: "7-Day Voice Flow Activation",
        planWhy: "This plan is recommended because your first need is smoother mouth movement, breath, rhythm, and speaking flow.",
        cta: "Start mouth-flow practice"
      },
      "Word Availability Block": {
        explanation: "Your main block is Word Availability. This means you may know English words, but they are not ready in natural groups when you speak.",
        why: "Words may be familiar in your mind, but they are not stored in ready-to-speak groups.",
        practice: "Word combination drills, core word command, and phrase groups help words come faster when you speak.",
        plan: "7-Day Word Combination Activation",
        planWhy: "This plan is recommended because useful words need to become ready in natural speaking groups.",
        cta: "Start word-flow practice"
      },
      "Sentence Formation Block": {
        explanation: "Your main block is Sentence Formation. This means you may know the words, but your sentences do not form quickly enough while speaking.",
        why: "This happens when words are known individually, but common sentence patterns are not automatic yet.",
        practice: "Sentence pattern gym, sentence expansion drills, and repeated starters help sentences form naturally.",
        plan: "7-Day Sentence Pattern Activation",
        planWhy: "This plan is recommended because common sentence structures need to become automatic.",
        cta: "Start sentence-pattern practice"
      },
      "Grammar Pattern Block": {
        explanation: "Your main block is Grammar Pattern Comfort. This means you may be overthinking grammar while speaking.",
        why: "Your mind may check grammar while your conversation is moving, and that breaks flow.",
        practice: "Pattern-based grammar practice helps you use natural structures without stopping to think about rules.",
        plan: "7-Day Natural Grammar Pattern Activation",
        planWhy: "This plan is recommended because grammar needs to become a speaking pattern, not a rule-checking habit.",
        cta: "Start pattern practice"
      },
      "Expression Block": {
        explanation: "Your main block is Expression. Your English may communicate basic meaning, but it does not yet carry your full personality, confidence, or ideas.",
        why: "You may be able to speak basic English, but your real thoughts, feelings, and personality need stronger expression patterns.",
        practice: "Expression upgrade drills, storytelling practice, and real-life speaking tasks help your English sound more like you.",
        plan: "7-Day Expression Upgrade Activation",
        planWhy: "This plan is recommended because your next step is clearer, more natural, and more confident expression.",
        cta: "Start expression practice"
      },
      "Confidence Block": {
        explanation: "Your main block is Confidence. Your English ability may be stronger than your speaking confidence.",
        why: "Your English may be better than you think, but nervousness interrupts your voice before your ideas come out.",
        practice: "Safe recording practice, daily speaking missions, and confidence-building repetition help your voice stay steady.",
        plan: "7-Day Speaking Confidence Activation",
        planWhy: "This plan is recommended because confidence grows through safe, simple, repeated speaking practice.",
        cta: "Start confidence practice"
      }
    };

    const labels = {
      speechFlow: "Speech Flow",
      wordAvailability: "Word Availability",
      sentencePatternComfort: "Sentence Pattern Comfort",
      expressionClarity: "Expression Clarity",
      naturalness: "Naturalness",
      speakingConfidence: "Speaking Confidence"
    };

    const scoreDescriptions = {
      speechFlow: "Smoothness, pauses, rhythm, and ability to continue speaking.",
      wordAvailability: "How quickly useful words and natural word groups come while speaking.",
      sentencePatternComfort: "How naturally complete sentence patterns form in real time.",
      expressionClarity: "How clearly your ideas are explained and understood.",
      naturalness: "How conversational your English sounds, with less translation-style structure.",
      speakingConfidence: "Voice steadiness, energy, and willingness to keep speaking."
    };

    function render() {
      const saved = JSON.parse(localStorage.getItem("fluencyMagicTest") || "null");
      const root = document.getElementById("result");
      if (!saved || !saved.result) {
        root.innerHTML = `
          <section class="hero empty">
            <h1>Your Fluency Snapshot Is Waiting</h1>
            <p class="lead">Complete the Free Fluency Test first so we can show your level, speaking block, and practice direction.</p>
            <div class="actions" style="justify-content:center"><a class="button" href="/fluency-test">Start My Free Fluency Test</a></div>
          </section>
        `;
        return;
      }

      const { result, lead } = saved;
      const level = result.level;
      const block = result.block;
      const levelCopy = levelTemplates[level.name];
      const blockCopy = blockTemplates[block.name];
      const scores = { ...result.scores };
      if (scores.sentencePattern && !scores.sentencePatternComfort) {
        scores.sentencePatternComfort = scores.sentencePattern;
        delete scores.sentencePattern;
      }
      localStorage.setItem("fluencyMagicPlanKey", result.recommendedPlan);
      ensureActivationProfile(saved);

      root.innerHTML = `
        <section class="hero">
          <div class="hero-grid">
            <div>
              <div class="badge">Your Fluency Snapshot Is Ready</div>
              <h1>${lead.firstName ? `${lead.firstName}, y` : "Y"}our fluency score is ${result.overall}/100</h1>
              <p class="lead">This is not a judgement of your intelligence or potential. It is a simple diagnosis of where your spoken English gets stuck and what to practise next.</p>
              <p class="lead">Level ${level.levelNumber || ""}: <strong>${level.name}</strong>. ${level.description}</p>
              <div class="actions">
                <a class="button" href="/activation">Start My Free 7-Day Plan</a>
              </div>
            </div>
            <div class="score-ring" style="--score-deg:${result.overall * 3.6}deg">
              <div><strong>${result.overall}</strong><span>out of 100</span></div>
            </div>
          </div>
        </section>

        <section class="grid">
          <article class="panel">
            <h2>Your Score Breakdown</h2>
            <div class="scores">
              ${Object.entries(scores).map(([key, value]) => `
                <div class="score-row">
                  <div><strong>${labels[key]}</strong><p>${scoreDescriptions[key]}</p><div class="track"><span class="fill" style="--w:${value}%"></span></div></div>
                  <strong>${value}/100</strong>
                </div>
              `).join("")}
            </div>
          </article>

          <article class="panel block-card">
            <h2>Your Main Speaking Block</h2>
            <h3>${block.name}</h3>
            <p>${blockCopy.explanation}</p>
            <h3>Why this happens</h3>
            <p>${blockCopy.why}</p>
            <h3>What helps</h3>
            <p>${block.practice}</p>
            <div class="actions"><a class="button" href="/activation">Start My Free 7-Day Plan</a></div>
          </article>
        </section>

        <section class="grid">
          <article class="panel">
            <h2>What This Means</h2>
            <h3>${levelCopy.headline}</h3>
            <p>${levelCopy.what}</p>
            <h3>What to focus on next</h3>
            <p>${levelCopy.focus}</p>
            <p><strong>${levelCopy.encourage}</strong></p>
          </article>

          <article class="panel">
            <h2>Your Recommended Next Step</h2>
            <h3>${blockCopy.plan}</h3>
            <p>${blockCopy.planWhy}</p>
            <p>You do not need to become perfect before you speak. You become fluent by speaking in the right way every day.</p>
            <div class="actions"><a class="button" href="/activation">Start My Free 7-Day Plan</a></div>
          </article>
        </section>

        <section class="conversion">
          <h2>Your Fluency Can Improve Faster When You Practise the Right Way</h2>
          <p class="lead">Most people keep watching English videos, memorising words, or waiting for confidence. But speaking improves when you practise the right word groups, sentence patterns, and voice flow every day.</p>
          <p class="lead">Your report shows where your fluency is getting stuck. The 7-Day Fluency Activation Plan gives you your first set of guided speaking drills to start building flow.</p>
          <h3>You Do Not Become Fluent by Waiting. You Become Fluent by Speaking.</h3>
          <p class="lead">You do not need perfect English before you begin. You need the right speaking practice, repeated daily. Fluency Magic will help you train your voice, words, sentence patterns, and confidence step by step.</p>
          <div class="actions"><a class="button" href="/activation">Start My Free 7-Day Plan</a></div>
        </section>
      `;
    }

    function ensureActivationProfile(saved) {
      if (localStorage.getItem("fluencyMagicActivation")) return;
      const token = crypto.randomUUID ? crypto.randomUUID() : `fm-${Date.now()}-${Math.random().toString(16).slice(2)}`;
      localStorage.setItem("fluencyMagicActivation", JSON.stringify({
        token,
        createdAt: new Date().toISOString(),
        lead: saved.lead || {},
        result: saved.result || null,
        planKey: saved.result?.recommendedPlan || "wordAvailability",
        currentDay: 1,
        completedDays: [],
        recordings: {},
        reminderPreference: {
          email: Boolean(saved.lead?.email),
          whatsapp: Boolean(saved.lead?.phone),
          time: "08:00"
        }
      }));
    }

    render();
  </script>
</body>
</html>
